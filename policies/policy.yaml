# Sentinel policy for the demo bank deployed alongside Sentinel.
#
# Three real agents run as AWS Lambda functions, each with its own IAM role:
#   kyc-agent        verifies new customers' identity documents, one customer at a time
#   loan-agent       sorts loan applications into products and decides them
#   reporting-agent  builds the weekly operations report from aggregate data only
#
# All three IAM roles can technically read the whole demo bucket (a common real-world
# over-grant). Sentinel's policy is what narrows each agent to its job; CloudTrail
# bypass detection catches an agent that reads S3 directly instead.
#
# The richer multi-agent example used by the test-suite is tests/fixtures/policy_example.yaml.

version: 1
organization: sentinel-demo-bank

defaults:
  unknown_agent: QUARANTINE
  fail_mode: closed
  hold_timeout_seconds: 900
  severity_modes:
    INFO: LOG
    LOW: LOG
    MEDIUM: FLAG
    HIGH: HOLD
    CRITICAL: QUARANTINE

bypass_window_seconds: 600

classifications:
  - name: RESTRICTED_PII
    level: 4
    description: Customer personal data and KYC applications (synthetic in this demo).
    resources:
      - "s3://sentinel-demo-bank-*/pii/**"
      - "s3://sentinel-demo-bank-*/kyc/**"
      - "s3://sentinel-demo-bank-*/loans/**"
  - name: INTERNAL
    level: 1
    description: Aggregate operational reports. No customer-level data.
    resources:
      - "s3://sentinel-demo-bank-*/reports/**"
      - "s3://sentinel-demo-bank-*/config/**"

egress:
  allowed_domains: []

# Identities allowed to touch the demo bucket outside Sentinel: the CDK roles that
# seed the demo data on deploy and empty the bucket on teardown.
trusted_principals:
  - "arn:aws:sts::*:assumed-role/*CustomCDKBucketDeployment*/**"
  - "arn:aws:sts::*:assumed-role/*CustomS3AutoDeleteObjects*/**"
  - "arn:aws:sts::*:assumed-role/*AWSCDKCfnRole*/**"

agents:
  - id: kyc-agent
    description: Verifies identity documents for new-customer onboarding, one customer at a time.
    owner: kyc-platform@sentinel-demo-bank.example
    risk_tier: high
    max_clearance: RESTRICTED_PII
    principals: ["arn:aws:sts::*:assumed-role/sentinel-demo-kyc-agent/**"]
    heartbeat_seconds: 900
    permissions:
      - actions: [list]
        resources: ["s3://sentinel-demo-bank-*/kyc", "s3://sentinel-demo-bank-*/kyc/**"]
      - actions: [read]
        resources: ["s3://sentinel-demo-bank-*/kyc/**", "s3://sentinel-demo-bank-*/pii/customers/*"]
        max_records_per_action: 1
      - actions: [write]
        resources: ["s3://sentinel-demo-bank-*/kyc/*/verification.json"]
    rate_limits:
      actions_per_minute: 60
      records_per_hour: 300
      distinct_resources_per_hour: 300

  - id: loan-agent
    description: Sorts loan applications into products (education, home, car, land, agriculture, personal) and approves or rejects each one against that product's rules, one application at a time.
    owner: lending-platform@sentinel-demo-bank.example
    risk_tier: high
    max_clearance: RESTRICTED_PII
    principals: ["arn:aws:sts::*:assumed-role/sentinel-demo-loan-agent/**"]
    heartbeat_seconds: 900
    permissions:
      - actions: [list]
        resources: ["s3://sentinel-demo-bank-*/loans/applications", "s3://sentinel-demo-bank-*/loans/applications/**"]
      - actions: [read]
        resources: ["s3://sentinel-demo-bank-*/loans/applications/*", "s3://sentinel-demo-bank-*/kyc/*/verification.json"]
        max_records_per_action: 1
      - actions: [read]
        resources: ["s3://sentinel-demo-bank-*/config/loan_products.json"]
      - actions: [write]
        resources: ["s3://sentinel-demo-bank-*/loans/decisions/*.json"]
    rate_limits:
      actions_per_minute: 60
      records_per_hour: 300

  - id: reporting-agent
    description: Builds the weekly operations report from daily aggregate reports. Never needs customer-level data.
    owner: bi-team@sentinel-demo-bank.example
    risk_tier: medium
    max_clearance: INTERNAL
    principals: ["arn:aws:sts::*:assumed-role/sentinel-demo-reporting-agent/**"]
    heartbeat_seconds: 900
    permissions:
      - actions: [list, read]
        resources: ["s3://sentinel-demo-bank-*/reports", "s3://sentinel-demo-bank-*/reports/**"]
      - actions: [write]
        resources: ["s3://sentinel-demo-bank-*/reports/weekly/**"]
    rate_limits:
      actions_per_minute: 100
      records_per_hour: 5000

# Decisions the loan agent writes are checked against Sentinel's own copy of the
# bank's loan product rules (kept in sync with demo/generate_data.py by a test).
# An approval that breaks them is held for a human; a mis-filed loan is flagged.
output_checks:
- id: loan-decisions
  resources: ['s3://sentinel-demo-bank-*/loans/decisions/*.json']
  validator: loan_decision
  params:
    products:
      education: {rate_min: 8.5, rate_max: 11.0, min_credit_score: 650, max_amount: 4000000, max_tenure_months: 180,
        max_foir: 0.6, collateral: above_threshold, collateral_threshold: 750000, max_ltv: 0.9}
      home: {rate_min: 8.4, rate_max: 9.8, min_credit_score: 700, max_amount: 20000000, max_tenure_months: 360,
        max_foir: 0.5, collateral: required, max_ltv: 0.8}
      car: {rate_min: 9.0, rate_max: 11.5, min_credit_score: 680, max_amount: 3000000, max_tenure_months: 84, max_foir: 0.5,
        collateral: required, max_ltv: 0.85}
      land: {rate_min: 9.5, rate_max: 12.0, min_credit_score: 720, max_amount: 10000000, max_tenure_months: 180,
        max_foir: 0.45, collateral: required, max_ltv: 0.7}
      agriculture: {rate_min: 7.0, rate_max: 9.0, min_credit_score: 600, max_amount: 1000000, max_tenure_months: 84,
        max_foir: 0.6, collateral: above_threshold, collateral_threshold: 200000, max_ltv: 0.9, requires_land_records: true}
      personal: {rate_min: 11.0, rate_max: 16.0, min_credit_score: 720, max_amount: 1500000, max_tenure_months: 60,
        max_foir: 0.5, collateral: none}
    purpose_keywords:
      agriculture: [tractor, irrigation, crop, farm, seeds, fertiliser, paddy, harvest]
      education: [tuition, college, university, fees, mba, degree, admission, course]
      car: [car, suv, hatchback, sedan, vehicle]
      home: [flat, apartment, house, 2bhk, 3bhk, home]
      land: [plot, site, land]
      personal: [wedding, medical, treatment, renovation, travel, personal]

rules:
  output.loan_policy_breach: {mode: HOLD}
  output.loan_rate_out_of_band: {mode: HOLD}
  output.loan_misclassified: {mode: FLAG}
  dlp.pii_exfiltration: {mode: QUARANTINE}
  dlp.secret_leak: {mode: BLOCK}
  iam.privilege_escalation: {mode: QUARANTINE}
  egress.unapproved_destination: {mode: BLOCK}
  bypass.unmediated_access: {mode: QUARANTINE}
  access.requires_approval: {mode: HOLD}
  injection.prompt_injection: {mode: BLOCK}

anomaly:
  enabled: true
  min_samples: 200
  record_z: 6.0

judge:
  enabled: false
